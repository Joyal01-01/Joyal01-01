name: Update GitHub Profile Assets

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_profile.py"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate profile assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_profile.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Update GitHub profile statistics"
          git push
